# Render.com Infrastructure-as-Code 정의
# Render 는 저장소 '루트'의 render.yaml 만 읽는다.
# 이 저장소는 루트에 펌웨어(insole_ble_app.ino)가 함께 있으므로,
# 웹앱 소스가 있는 application/ 을 서비스 루트로 지정한다.
# 참고: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: postureiq
    runtime: docker
    plan: free
    region: singapore       # 한국에서 가장 가까운 무료 region
    rootDir: application    # ★ 서비스 루트 (Dockerfile 의 COPY 가 상대경로라 필수)
    dockerfilePath: ./Dockerfile   # rootDir 기준
    autoDeploy: true        # GitHub push 시 자동 재배포
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod         # dev 프로파일 비활성화 (file: location override 안 씀)

# 대시보드에서 수동으로 연결하는 경우에는
# Settings > Root Directory 를 'application' 으로 지정하면 같은 효과.
